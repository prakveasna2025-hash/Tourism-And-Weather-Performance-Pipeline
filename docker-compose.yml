version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-metadata:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__WEBSERVER__SECRET_KEY: 'my-super-secret-key'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-metadata:
      condition: service_healthy

services:
  # 1. METADATA DATABASE (For Airflow's internal state)
  postgres-metadata:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      retries: 5
    restart: always

  # 2. WAREHOUSE DATABASE (For your actual data pipeline)
  postgres-warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: tourism_weather_dw
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql/data
    ports:
      - "5435:5432" # Exposed on 5433 so it doesn't clash with metadata DB
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "warehouse" ]
      interval: 5s
      retries: 5
    restart: always

  # 3. AIRFLOW INIT (Migrates DB & Creates Admin User)
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
            --username airflow_one \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com \
            --password chhanunde
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'

  # 4. AIRFLOW WEBSERVER (The UI)
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # 5. AIRFLOW SCHEDULER (Runs the DAGs)
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

volumes:
  postgres_metadata_data:
  postgres_warehouse_data:
